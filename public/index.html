<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IM Server — AI Key Gateway</title>
<style>
  :root{
    --bg:#0a0a0c; --panel:#101014; --card:#141419; --line:#232329;
    --txt:#f4f4f5; --dim:#9c9ca6; --faint:#63636c;
    --acc:#38bdf8; --acc2:#a78bfa;
    --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --sidebar-w:242px; --top-h:58px; --rad:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Hind Siliguri',system-ui,-apple-system,sans-serif;min-height:100vh}
  #topbar{position:fixed;top:0;left:0;right:0;height:var(--top-h);background:rgba(16,16,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;z-index:40}
  #burger{display:none;background:none;border:1px solid var(--line);color:var(--txt);border-radius:9px;font-size:18px;padding:6px 11px;cursor:pointer}
  .logo{font-weight:800;letter-spacing:2.5px;font-size:16px;white-space:nowrap}
  .logo .im{background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo small{display:block;font-size:10px;color:var(--faint);letter-spacing:1px;font-weight:400}
  #topbar .sp{flex:1}
  .pill{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
  .pill.admin{color:var(--warn);border-color:#713f12}
  .iconbtn{position:relative;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 11px;font-size:16px;cursor:pointer}
  .iconbtn .dot{position:absolute;top:-7px;right:-7px;background:var(--bad);color:#fff;font-size:10.5px;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700}
  .btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121b;border:none;padding:9px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;white-space:nowrap}
  .btn.ok{background:#14532d;color:#fff}
  .btn.danger{background:#2b1215;color:var(--bad);border:1px solid #5c1d1d}
  .btn.small{padding:6px 13px;font-size:12.5px}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
  .btn.block{width:100%;padding:12px;font-size:15px}
  #sidebar{position:fixed;top:var(--top-h);left:0;bottom:0;width:var(--sidebar-w);background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;z-index:30;overflow-y:auto;transition:transform .25s ease}
  #sidebar nav{display:flex;flex-direction:column;gap:4px}
  .mi{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:var(--dim);cursor:pointer;font-size:14.5px;border:1px solid transparent;position:relative;font-family:inherit;background:none;width:100%;text-align:left}
  .mi:hover{background:#17171c;color:var(--txt)}
  .mi.active{background:linear-gradient(135deg,rgba(56,189,248,.14),rgba(167,139,250,.14));border-color:#2b3542;color:var(--txt);font-weight:700}
  .mi .ic{font-size:17px;width:24px;text-align:center}
  .mi .bdg{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px;font-weight:700}
  .mi .bdg.warn{background:#92610e}
  #sidebar .sec{font-size:11px;color:var(--faint);letter-spacing:1.5px;padding:14px 14px 6px}
  #main{margin-left:var(--sidebar-w);margin-top:var(--top-h);padding:26px 26px 70px;max-width:1080px}
  .pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
  .pagehead h2{font-size:21px}
  .pagehead p{color:var(--dim);font-size:13px;margin-top:3px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:20px;margin-bottom:16px}
  .card h3{font-size:15.5px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:18px 14px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));opacity:.7}
  .stat b{font-size:27px;display:block;line-height:1.15}
  .stat span{color:var(--dim);font-size:12.5px}
  .stat .sub{font-size:11px;color:var(--faint);margin-top:2px;display:block}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:12px;letter-spacing:.4px}
  input,textarea{width:100%;background:#0c0c0f;border:1px solid var(--line);color:var(--txt);padding:11px 14px;border-radius:10px;font-size:14.5px;margin-bottom:10px;font-family:inherit}
  textarea{min-height:84px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--acc)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .badge{font-size:11.5px;padding:3px 11px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
  .badge.ok{color:var(--ok);border-color:#14532d}
  .badge.warn{color:var(--warn);border-color:#713f12}
  .badge.bad{color:var(--bad);border-color:#7f1d1d}
  pre{background:#0b0b0e;border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;font-size:12.5px;margin:10px 0;white-space:pre-wrap}
  code{color:#e5e5e5;font-family:ui-monospace,monospace}
  .keybox{background:#0b0b0e;border:1px dashed var(--warn);border-radius:10px;padding:14px;margin:12px 0;word-break:break-all;font-family:ui-monospace,monospace;font-size:15px;letter-spacing:1px}
  .hidden{display:none!important}
  .note{color:var(--dim);font-size:12.5px;margin-top:8px;line-height:1.6}
  .err{color:var(--bad);margin-top:8px;font-size:13.5px}
  .okmsg{color:var(--ok);margin-top:8px;font-size:13.5px}
  .notif{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:#101014}
  .notif.unread{border-color:#92610e;background:#141309}
  .notif b{display:block;margin-bottom:5px;font-size:14.5px}
  .notif span{color:var(--dim);font-size:12px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .kv span:first-child{color:var(--dim);flex-shrink:0}
  .kv span:last-child{text-align:right;word-break:break-all}
  #login,#waiting{min-height:calc(100vh - var(--top-h));display:flex;align-items:center;justify-content:center;padding:20px;margin-top:var(--top-h)}
  #login .card,#waiting .card{max-width:430px;width:100%;text-align:center;padding:34px 28px}
  #waiting .big{font-size:52px;margin-bottom:10px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
  .modal .card{max-width:520px;width:100%;max-height:85vh;overflow-y:auto}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:25;display:none}
  .empty{color:var(--faint);font-size:13.5px;padding:14px 4px}
  .quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .qa{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:18px;cursor:pointer;text-align:left;color:var(--txt);font-family:inherit;font-size:14px}
  .qa:hover{border-color:var(--acc)}
  .qa b{display:block;font-size:15px;margin-bottom:4px}
  .qa span{color:var(--dim);font-size:12.5px}
  @media (max-width:860px){
    #sidebar{transform:translateX(-105%);top:0;padding-top:calc(var(--top-h) + 12px)}
    #sidebar.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.5)}
    #scrim.on{display:block}
    #main{margin-left:0;padding:18px 14px 70px}
    #burger{display:block}
    .pill{max-width:130px}
  }
</style>
</head>
<body>

<div id="topbar">
  <button id="burger">☰</button>
  <div class="logo"><span class="im">IM</span> SERVER<small>AI KEY GATEWAY</small></div>
  <div class="sp"></div>
  <button id="bellBtn" class="iconbtn hidden">🔔<span id="bellDot" class="dot hidden">0</span></button>
</div>

<aside id="sidebar" class="hidden">
  <div class="sec">মেনু</div>
  <nav id="menuNav"></nav>
  <div style="padding:14px 4px 4px"><button id="logoutBtn" class="btn ghost hidden" style="width:100%">🚪 লগআউট</button></div>
</aside>
<div id="scrim"></div>

<main id="main" class="hidden">
  <div class="pagehead"><div><h2 id="pageTitle"></h2><p id="pageSub"></p></div><div id="pageAct"></div></div>
  <div id="pageBody"></div>
</main>

<div id="login" class="hidden">
  <div class="card">
    <div class="logo" style="font-size:22px;margin-bottom:6px"><span class="im">IM</span> SERVER</div>
    <p class="note" style="margin-bottom:18px">AI Key Gateway — লগইন করে শুরু করো</p>
    <button class="btn block" id="loginBtn">Google দিয়ে লগইন</button>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<div id="waiting" class="hidden">
  <div class="card">
    <div class="big">⏳</div>
    <h2 style="margin-bottom:8px">অ্যাডমিনের অনুমতি দরকার</h2>
    <p class="note" id="waitMsg">তোমার অ্যাকাউন্ট এখনো approve হয়নি। নিচের বাটনে রিকোয়েস্ট পাঠাও — অ্যাডমিন approve করলেই ভেতরে ঢুকতে পারবে।</p>
    <br><button class="btn block" id="reqBtn">📩 অ্যাডমিনের কাছে রিকোয়েস্ট পাঠাও</button>
    <p class="err" id="reqErr"></p><p class="okmsg" id="reqOk"></p>
    <p class="note" id="waitPoll">অটো চেক চলছে…</p>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="card" id="modalBody"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

let firebaseConfig;
try {
  const rc = await fetch("/api/public/firebase-config");
  firebaseConfig = await rc.json();
  if (!rc.ok || !firebaseConfig.apiKey) throw new Error(firebaseConfig.error || "config পাওয়া যায়নি");
} catch (e) {
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("login").innerHTML = '<div class="card"><h2>⚙️ সেটআপ বাকি</h2><p class="note">সার্ভারে Firebase সংযোগ এখনো বসানো হয়নি — একটু পরে আবার চেষ্টা করো।</p></div>';
  throw e;
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let idToken = null, me = null, menu = [], pollTimer = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = (ts) => !ts ? "—" : new Date(ts).toLocaleString("bn-BD", { hour12: true });

async function api(path, method = "GET", body) {
  const r = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + idToken },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { $("loginErr").textContent = "লগইন ব্যর্থ: " + e.message; }
};
$("logoutBtn").onclick = () => signOut(auth);
$("bellBtn").onclick = () => go("notif");
$("burger").onclick = () => { $("sidebar").classList.add("open"); $("scrim").classList.add("on"); };
$("scrim").onclick = closeSide;
$("modal").onclick = (e) => { if (e.target.id === "modal") $("modal").classList.add("hidden"); };
function closeSide(){ $("sidebar").classList.remove("open"); $("scrim").classList.remove("on"); }

onAuthStateChanged(auth, async (u) => {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (!u) {
    $("login").classList.remove("hidden");
    $("main").classList.add("hidden"); $("sidebar").classList.add("hidden"); $("waiting").classList.add("hidden");
    $("logoutBtn").classList.add("hidden"); $("bellBtn").classList.add("hidden");
    return;
  }
  idToken = await u.getIdToken();
  try { me = await api("/api/user/me"); }
  catch (e) { $("loginErr").textContent = e.message; signOut(auth); return; }
  $("logoutBtn").classList.remove("hidden");
  $("login").classList.add("hidden");

  if (!me.isAdmin && me.userStatus !== "approved") {
    // ⏳ approval-এর অপেক্ষায়
    $("main").classList.add("hidden"); $("sidebar").classList.add("hidden"); $("bellBtn").classList.add("hidden");
    $("waiting").classList.remove("hidden");
    $("reqErr").textContent = ""; $("reqOk").textContent = "";
    $("reqBtn").onclick = sendRequest;
    // ৩০ সেকেন্ড পরপর চেক — approve হলেই ভেতরে
    pollTimer = setInterval(async () => {
      try {
        const m = await api("/api/user/me");
        if (m.isAdmin || m.userStatus === "approved") location.reload();
      } catch {}
    }, 30000);
    return;
  }
  $("waiting").classList.add("hidden");
  $("bellBtn").classList.remove("hidden");
  $("main").classList.remove("hidden"); $("sidebar").classList.remove("hidden");
  buildMenu();
  registerPush();
  refreshBadges();
  setInterval(refreshBadges, 30000);
  go("home");
});

async function sendRequest(){
  $("reqErr").textContent = ""; $("reqOk").textContent = "";
  $("reqBtn").disabled = true;
  try {
    const d = await api("/api/user/request-access", "POST", {});
    $("reqOk").textContent = "✅ " + d.note;
    $("reqBtn").textContent = "🔄 আবার রিকোয়েস্ট পাঠাও";
  } catch(e){ $("reqErr").textContent = e.message; }
  $("reqBtn").disabled = false;
}

/* ---------------- menu ---------------- */
function buildMenu(){
  menu = me.isAdmin ? [
    {k:"home", t:"হোম", ic:"🏠"},
    {k:"developer", t:"ডেভেলপার", ic:"💻"},
    {k:"test", t:"টেস্ট", ic:"🧪"},
    {k:"users", t:"ইউজার", ic:"👥", badge:"users"},
    {k:"gkeys", t:"Gemini Keys", ic:"🔑"},
    {k:"notif", t:"নোটিফিকেশন", ic:"🔔", badge:"notif"},
    {k:"profile", t:"প্রোফাইল", ic:"👤"},
  ] : [
    {k:"home", t:"হোম", ic:"🏠"},
    {k:"notif", t:"নোটিফিকেশন", ic:"🔔", badge:"notif"},
    {k:"docs", t:"ব্যবহার-বিধি", ic:"📖"},
    {k:"profile", t:"প্রোফাইল", ic:"👤"},
  ];
  $("menuNav").innerHTML = menu.map(m =>
    `<button class="mi" data-k="${m.k}"><span class="ic">${m.ic}</span>${m.t}${m.badge?`<span class="bdg hidden" id="bdg-${m.badge}">0</span>`:""}</button>`).join("");
  document.querySelectorAll(".mi").forEach(b => b.onclick = () => { go(b.dataset.k); closeSide(); });
}
function setBadge(name, n, warn){
  const el = $("bdg-" + name);
  if(!el) return;
  el.textContent = n; el.classList.toggle("hidden", !n); el.classList.toggle("warn", !!warn && !!n);
}
function go(k){
  document.querySelectorAll(".mi").forEach(x => x.classList.toggle("active", x.dataset.k === k));
  const titles = {home:["হোম","সবকিছুর সারসংক্ষেপ"],developer:["ডেভেলপার","সোর্স কোড — অ্যাপে ব্যবহারের জন্য"],test:["টেস্ট","API key দিয়ে লাইভ টেস্ট"],users:["ইউজার","অ্যাকাউন্ট approve / block"],gkeys:["Gemini Keys","পুলে থাকা Gemini API key গুলো"],dkeys:["Developer Keys","ইস্যু করা developer key গুলো"],notif:["নোটিফিকেশন","তোমার নোটিফিকেশন"],docs:["ব্যবহার-বিধি","তোমার অ্যাপে যেভাবে ব্যবহার করবে"],profile:["প্রোফাইল","তোমার অ্যাকাউন্টের তথ্য"]};
  $("pageTitle").textContent = titles[k][0]; $("pageSub").textContent = titles[k][1];
  const B = $("pageBody");
  B.innerHTML = '<div class="card"><p class="note">লোড হচ্ছে…</p></div>';
  (async () => {
    try {
      if (k==="home") me.isAdmin ? await vHomeAdmin(B) : await vHomeUser(B);
      else if (k==="developer") await vDocs(B);
      else if (k==="test") await vTest(B);
      else if (k==="users") await vUsers(B);
      else if (k==="gkeys") await vGkeys(B);
      else if (k==="dkeys") await vDkeys(B);
      else if (k==="notif") await vNotif(B);
      else if (k==="docs") vDocs(B);
      else if (k==="profile") await vProfile(B);
    } catch(e){ B.innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p></div>`; }
  })();
}
async function refreshBadges(){
  try {
    const n = await api("/api/user/notifications");
    const d = $("bellDot");
    d.textContent = n.unread; d.classList.toggle("hidden", !n.unread);
    setBadge("notif", n.unread);
    if (me?.isAdmin) {
      const u = await api("/api/admin/users");
      setBadge("users", u.users.filter(x => x.status === "pending").length, true);
    }
  } catch {}
}

/* ---------------- home ---------------- */
function statCards(items){
  return `<div class="grid">${items.map(([v,l,sub])=>`<div class="stat"><b>${v}</b><span>${l}</span>${sub?`<span class="sub">${sub}</span>`:""}</div>`).join("")}</div>`;
}
async function vHomeAdmin(B){
  const s = await api("/api/admin/stats");
  const u = await api("/api/admin/users");
  const pend = u.users.filter(x => x.status === "pending");
  B.innerHTML =
    statCards([
      [s.totalUsers,"মোট ইউজার"],
      [pend.length,"অপেক্ষমাণ ইউজার"],
      [s.healthyKeys + "/" + s.geminiKeys,"সচল Gemini Key","মোট "+s.geminiKeys],
      [s.devKeys,"Developer Key"],
      [s.requestsToday,"আজকের রিকোয়েস্ট"],
      [s.totalGeminiRequests,"সর্বমোট রিকোয়েস্ট"],
    ]) +
    `<div class="card"><h3>⚡ দ্রুত কাজ</h3><div class="quick">
      <button class="qa" onclick="document.querySelector('[data-k=users]').click()"><b>👥 ইউজার দেখো</b><span>${pend.length}টা অপেক্ষমাণ</span></button>
      <button class="qa" onclick="document.querySelector('[data-k=gkeys]').click()"><b>🔑 Key যোগ করো</b><span>পুলে নতুন Gemini key</span></button>
      <button class="qa" onclick="document.querySelector('[data-k=dkeys]').click()"><b>👨‍💻 Dev Keys</b><span>ইস্যু করা key গুলো</span></button>
    </div></div>` +
    `<div class="card"><h3>🔑 Key হেলথ</h3><div style="overflow-x:auto"><table><thead><tr><th>লেবেল</th><th>স্ট্যাটাস</th><th>মোট রিকোয়েস্ট</th><th>এরর</th><th>শেষ ব্যবহার</th></tr></thead><tbody>` +

async function vTest(B){
  let key = null, keyErr = "";
  try {
    const kd = await api("/api/user/my-keys");
    if (kd.keys.length && kd.keys[0].rawKey) key = kd.keys[0].rawKey;
    else keyErr = "তোমার এখনো API key নেই — প্রোফাইল পেজ থেকে ⚡ জেনারেট করো বাটনে বানিয়ে নাও।";
  } catch(e){ keyErr = e.message; }
  B.innerHTML = `<div class="card"><h3>🧪 API টেস্ট</h3>
    ${keyErr ? `<p class="err">${esc(keyErr)}</p>` : `
    <p class="note">তোমার বর্তমান API key (<code>${esc(key.slice(0,6))}…</code>) দিয়ে ব্যাকএন্ডে টেস্ট মেসেজ পাঠাও — "হাই" লিখে পাঠালে উত্তর আসে কিনা দেখা যাবে।</p>
    <div id="tLog" style="display:flex;flex-direction:column;gap:8px;margin:12px 0;max-height:380px;overflow-y:auto"></div>
    <div class="row"><input id="tInp" placeholder="হাই লিখে পাঠাও..." style="flex:1"><button class="btn" id="tSend">পাঠাও</button></div>
    <p class="note" id="tStat"></p>`}
  </div>`;
  if (!key) return;
  const log = $("tLog"), inp = $("tInp");
  function addMsg(text, who){
    const d = document.createElement("div");
    d.style.cssText = "max-width:88%;padding:9px 13px;border-radius:13px;font-size:14px;line-height:1.55;white-space:pre-wrap;" + (who==="me" ? "align-self:flex-end;background:var(--acc);color:#04121b" : "align-self:flex-start;background:var(--card2,#182230)");
    d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }
  async function run(){
    const t = inp.value.trim();
    if (!t) return;
    inp.value = "";
    addMsg(t, "me");
    const s = addMsg("⏳ পাঠাচ্ছি...", "bot");
    const t0 = Date.now();
    try {
      const r = await fetch("/api/v1/chat", { method: "POST",
        headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
        body: JSON.stringify({ model: "IM v2.7", messages: [{ role: "user", content: t }] }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
      const ms = ((Date.now() - t0) / 1000).toFixed(1);
      s.textContent = d.candidates[0].content.parts[0].text;
      $("tStat").innerHTML = `✅ <b>সফল</b> — ${ms}s | মডেল: <code>${esc(d._im?.model || "IM v2.7")}</code>`;
    } catch(e) {
      s.textContent = "❌ " + e.message;
      $("tStat").innerHTML = `❌ <b>ব্যর্থ</b> — ${esc(e.message)}`;
    }
  }
  $("tSend").onclick = run;
  inp.onkeydown = e => { if (e.key === "Enter") run(); };
  addMsg("হাই! টেস্ট মেসেজ পাঠাও।", "bot");
}

/* ---------------- web push ---------------- */
async function registerPush(force=false){
  try{
    if(!("serviceWorker" in navigator) || !("PushManager" in window)) return;
    const reg = await navigator.serviceWorker.register("/sw.js");
    const cur = await reg.pushManager.getSubscription();
    if(cur && !force) return;
    if(Notification.permission==="denied") return;
    if(Notification.permission==="default" && !force) return;
    if(force && Notification.permission==="default") await Notification.requestPermission();
    if(Notification.permission!=="granted") return;
    const { vapidPublicKey } = await api("/api/user/push");
    if(!vapidPublicKey) return;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64(vapidPublicKey) });
    await api("/api/user/push","POST",{subscription:sub.toJSON()});
  }catch(e){ console.warn("push:", e.message); }
}
function urlB64(s){const p="=".repeat((4-s.length%4)%4);return Uint8Array.from(atob((s+p).replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));}
